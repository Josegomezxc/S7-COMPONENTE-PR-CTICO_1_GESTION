services:
  # Servicio 1: Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: donasara_db_container
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=donasara_prod
      - POSTGRES_USER=sara_admin
      - POSTGRES_PASSWORD=sara_secure_pass123
    ports:
      - "5432:5432"

  # Servicio 2: Aplicación Django (Doña Sara POS)
  web:
    build: .
    container_name: donasara_web_container
    restart: always
    command: >
      sh -c "python /app/manage.py migrate &&
             python /app/manage.py collectstatic --noinput &&
             python /app/manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env_local
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-fohrtxpop*pc4oj&jm97#t)z19p(gb3@6ojy2-f)_s)i2k4p_i
      - ALLOWED_HOSTS=*
      - USE_POSTGRES=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=donasara_prod
      - DB_USER=sara_admin
      - DB_PASSWORD=sara_secure_pass123
      - DB_HOST=db
      - DB_PORT=5432
      - NEGOCIO_NOMBRE=Doña Sara - Papas y Hamburguesas (Docker Local)
    depends_on:
      - db

volumes:
  postgres_data:
